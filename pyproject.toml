[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netscan"
version = "0.1.0"
description = "Scan files crossing your network for malware and disguised content"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The core scanner has no required dependencies: it runs on the standard library
# alone, with reduced coverage. Every detector degrades to "unavailable" rather
# than failing when its backend is missing.
dependencies = []

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
netscan = "netscan.cli:main"

[tool.setuptools.packages.find]
include = ["netscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # Detectors deliberately catch broad exceptions: a malformed hostile file
    # must produce a finding, never an unhandled traceback.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
