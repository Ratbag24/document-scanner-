# Squid configuration for netscan's inline (blocking) path.
#
# This file shows only the netscan-relevant directives -- merge them into your
# existing squid.conf rather than replacing it wholesale.
#
# READ THIS FIRST: without the TLS section at the bottom, Squid sees encrypted
# bytes for every HTTPS site and netscan will scan almost nothing. Enabling that
# section means intercepting TLS on your own network, which has real costs.
# docs/DEPLOYMENT.md explains the trade-off before you commit to it.

# ---------------------------------------------------------------------------
# Your network
# ---------------------------------------------------------------------------
acl localnet src 192.168.0.0/16
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src fc00::/7
acl localnet src fe80::/10

http_access allow localhost
http_access allow localnet
http_access deny all

# Transparent interception: the router redirects port 80 here.
http_port 3128 intercept
# Explicit-proxy port, for clients configured to use the proxy directly.
http_port 3129

# ---------------------------------------------------------------------------
# ICAP: hand every response body to netscan before the client sees it
# ---------------------------------------------------------------------------
icap_enable on

# Keep browsing working if the scanner is down. Set this to off only if you
# would rather lose internet access than miss a scan -- a crashed scanner then
# takes the whole network offline.
icap_service_failure_limit 5
icap_bypass_on_failure on

# Send the response headers before the body so netscan can skip what it does
# not need to buffer.
icap_send_client_ip on
icap_send_client_username off
icap_preview_enable on
icap_preview_size 4096

# 204 means "unmodified" and lets Squid stream the original response through
# without copying it, which matters for throughput.
icap_206_enable off
icap_persistent_connections on

icap_service netscan_resp respmod_precache icap://127.0.0.1:1344/netscan bypass=on

# Do not bother scanning what cannot carry a payload: it only adds latency.
acl scan_skip_type rep_mime_type ^text/css$
acl scan_skip_type rep_mime_type ^text/javascript$
acl scan_skip_type rep_mime_type ^application/javascript$
acl scan_skip_type rep_mime_type ^image/(gif|svg\+xml)$
acl scan_skip_type rep_mime_type ^font/
acl scan_skip_type rep_mime_type ^video/
acl scan_skip_type rep_mime_type ^audio/

adaptation_access netscan_resp deny scan_skip_type
adaptation_access netscan_resp allow all

# ---------------------------------------------------------------------------
# TLS interception (optional, and the whole decision -- read DEPLOYMENT.md)
# ---------------------------------------------------------------------------
# Uncomment this block ONLY after you have:
#   1. generated your own CA,
#   2. installed it as trusted on every device that will use this proxy,
#   3. accepted that cert-pinned apps (banking, some updaters, many mobile
#      apps) will break and need explicit bypass rules below,
#   4. blocked UDP/443 at the router so QUIC falls back to TCP -- otherwise
#      browsers bypass this proxy entirely and you scan nothing.
#
# https_port 3130 intercept ssl-bump \
#     generate-host-certificates=on \
#     dynamic_cert_mem_cache_size=8MB \
#     tls-cert=/etc/squid/ssl/netscan-ca.pem \
#     tls-key=/etc/squid/ssl/netscan-ca.pem
#
# sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 8MB
# sslcrtd_children 8
#
# # Sites that must NOT be intercepted: certificate pinning makes interception
# # fail in ways that look like a broken network. Add to this list liberally.
# acl tls_bypass ssl::server_name_regex \.bank$
# acl tls_bypass ssl::server_name_regex (^|\.)windowsupdate\.com$
# acl tls_bypass ssl::server_name_regex (^|\.)apple\.com$
# acl tls_bypass ssl::server_name_regex (^|\.)icloud\.com$
# acl tls_bypass ssl::server_name_regex (^|\.)whatsapp\.(net|com)$
# acl tls_bypass ssl::server_name_regex (^|\.)signal\.org$
#
# acl step1 at_step SslBump1
# ssl_bump peek step1
# ssl_bump splice tls_bypass
# ssl_bump bump all

# Large downloads must be fully buffered before a verdict is possible.
# Raise this if legitimate downloads are being passed through unscanned.
reply_body_max_size 0 allow all
